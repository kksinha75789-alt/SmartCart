    // MAIN APP COMPONENT

    function App() {
      // Dark / Light Mode
      const [darkMode, setDarkMode] = useState(() => {

      });

      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
          localStorage.setItem('smartcart_theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          localStorage.setItem('smartcart_theme', 'light');
        }
      }, [darkMode]);

      // Navigation
      // Tabs: 'home', 'products', 'flash-sale', 'architecture', 'failure-sim', 'analytics', 'monitoring', 'demo', 'admin', 'customer', 'checkout'

      const [priceFilter, setPriceFilter] = useState(2500);

      // Modals
      const [activeModalProduct, setActiveModalProduct] = useState(null);
      const [authModalOpen, setAuthModalOpen] = useState(false);
      const [authMode, setAuthMode] = useState('login');

      // Users & State
      const [currentUser, setCurrentUser] = useState(INITIAL_USERS[0]); // Alex Rivera
      const [usersList, setUsersList] = useState(INITIAL_USERS);
      const [wishlist, setWishlist] = useState(['PROD-IPHONE17']);

      // Products, Orders, Reservations, Events
      const [products, setProducts] = useState(() => {
        const saved = localStorage.getItem('smartcart_products');
        return saved ? JSON.parse(saved) : INITIAL_PRODUCTS;
      });

      const [orders, setOrders] = useState(() => {
        const saved = localStorage.getItem('smartcart_orders');
        return saved ? JSON.parse(saved) : INITIAL_ORDERS;
      });

      const [reservations, setReservations] = useState(() => {
        const saved = localStorage.getItem('smartcart_reservations');
        return saved ? JSON.parse(saved) : INITIAL_RESERVATIONS;
      });

      const [eventStream, setEventStream] = useState(() => {
        const saved = localStorage.getItem('smartcart_events');
        return saved ? JSON.parse(saved) : INITIAL_EVENTS;
      });

      // Cart
      const [cart, setCart] = useState([]);
      const [cartDrawerOpen, setCartDrawerOpen] = useState(false);
      const [couponCode, setCouponCode] = useState('');
      const [discountMultiplier, setDiscountMultiplier] = useState(0);

      // Checkout Reservation
      const [activeCheckoutReservation, setActiveCheckoutReservation] = useState(null);
      const [checkoutStep, setCheckoutStep] = useState(1);
      const [paymentMethod, setPaymentMethod] = useState('UPI');
      const [simulatedFailure, setSimulatedFailure] = useState(false);
      const [simulatedTimeout, setSimulatedTimeout] = useState(false);
      const [paymentLoading, setPaymentLoading] = useState(false);
      const [completedOrder, setCompletedOrder] = useState(null);

      // Toast Notifications
      const [toast, setToast] = useState(null);

      // Chaos / Failure States
      const [kafkaDown, setKafkaDown] = useState(false);
      const [circuitBreakerTripped, setCircuitBreakerTripped] = useState(false);
      const [pendingOutboxEvents, setPendingOutboxEvents] = useState([]);
      const [deadLetterEvents, setDeadLetterEvents] = useState([]);

      // Live Backend Integration & Auto-Sync
      const [backendConnected, setBackendConnected] = useState(false);

      useEffect(() => {
        const syncWithBackend = () => {
          fetch('/api/system/health')
            .then(res => {
              if (res.ok) {
                setBackendConnected(true);
                return fetch('/api/products')
                  .then(r => r.json())
                  .then(data => {
                    if (Array.isArray(data) && data.length > 0) setProducts(data);
                  });
              } else {
                setBackendConnected(false);
              }
            })
            .catch(() => {
              setBackendConnected(false);
            });
        };
        syncWithBackend();
        const interval = setInterval(syncWithBackend, 8000);
        return () => clearInterval(interval);
      }, []);

      // Persist to LocalStorage
      useEffect(() => { localStorage.setItem('smartcart_products', JSON.stringify(products)); }, [products]);
      useEffect(() => { localStorage.setItem('smartcart_orders', JSON.stringify(orders)); }, [orders]);
      useEffect(() => { localStorage.setItem('smartcart_reservations', JSON.stringify(reservations)); }, [reservations]);
      useEffect(() => { localStorage.setItem('smartcart_events', JSON.stringify(eventStream)); }, [eventStream]);

      const showToast = (message, type = 'info') => {
        setToast({ message, type, id: Date.now() });
      };

      const emitKafkaEvent = (topic, payload, producer = 'inventory-service', consumer = 'order-service') => {
        if (kafkaDown) {
          // Transactional Outbox Pattern: Buffer in pending outbox
          const outboxId = 'OUTBOX-' + Math.floor(1000 + Math.random() * 9000);
          const outboxItem = {
            id: outboxId,
            topic,
            payload,
            status: 'PENDING',
            retryCount: 0,
            timestamp: new Date().toLocaleTimeString()
          };
          setPendingOutboxEvents(prev => [outboxItem, ...prev]);
          showToast(`Kafka Outage! Event buffered in outbox_events table with status PENDING`, 'warning');
          return;
        }

        const newEvent = {
          id: 'EVT-' + Math.floor(1000 + Math.random() * 9000),
          topic: topic,
          producer: producer,
          consumer: consumer,
          partition: Math.floor(Math.random() * 3),
          offset: eventStream.length + 1400,
          timestamp: new Date().toLocaleTimeString(),
          status: 'PROCESSED',
          payload: payload
        };
        setEventStream(prev => [newEvent, ...prev.slice(0, 49)]);
      };

      // 5-MINUTE RESERVATION AUTO-EXPIRATION WORKER
      useEffect(() => {
        const timer = setInterval(() => {
          const now = Date.now();
          setReservations(prevReservations => {
            let updatedAny = false;
            const updated = prevReservations.map(res => {
              if (res.status === 'HELD' && new Date(res.expiresAt).getTime() <= now) {
                updatedAny = true;
                // Atomic Return of stock
                setProducts(prevProducts => prevProducts.map(p => {
                  if (p.id === res.productId) {
                    return {
                      ...p,
                      availableQuantity: p.availableQuantity + res.quantity,
                      reservedQuantity: Math.max(0, p.reservedQuantity - res.quantity)
                    };
                  }
                  return p;
                }));

                emitKafkaEvent('inventory.released', {
                  reservationId: res.id,
                  productId: res.productId,
                  quantity: res.quantity,
                  reason: 'TIMEOUT_EXPIRED_5_MINUTES'
                }, 'inventory-service', 'notification-service');

                if (activeCheckoutReservation && activeCheckoutReservation.id === res.id) {
                  showToast('Your 5-minute checkout reservation expired! Stock has been returned to the public pool.', 'error');
                  setActiveCheckoutReservation(null);
                  setCurrentTab('products');
                }

                return {
                  ...res,
                  status: 'EXPIRED',
                  releaseReason: 'TIMEOUT_EXPIRED_5_MINUTES',
                  releasedAt: new Date().toISOString()
                };
              }
              return res;
            });
            return updated;
          });
        }, 1000);

        return () => clearInterval(timer);
      }, [activeCheckoutReservation, kafkaDown]);

      // ATOMIC RESERVATION
      const handleReserveProduct = (product, quantity = 1, requestedByUserId = null) => {
        const userId = requestedByUserId || currentUser.id;
        const currentProd = products.find(p => p.id === product.id);

        if (!currentProd) return { success: false, message: 'Product not found.' };

        // ATOMIC CONDITIONAL CHECK:
        // UPDATE inventory SET available = available - 1 WHERE available >= 1
        if (currentProd.availableQuantity < quantity) {
          const conflictMsg = 'This item is currently reserved by another customer. It may become available again if their payment is not completed.';
          showToast(conflictMsg, 'warning');
          return {
            success: false,
            status: 'CONFLICT',
            availableStock: currentProd.availableQuantity,
            message: conflictMsg
          };
        }

        // WINNER
        const reservationId = 'RES-' + Math.random().toString(36).substring(2, 8).toUpperCase() + '-2026';
        const orderId = 'ORD-' + Math.floor(100000 + Math.random() * 900000);
        const heldAt = new Date();
        const expiresAt = new Date(heldAt.getTime() + 5 * 60 * 1000); // 300s

        setProducts(prev => prev.map(p => {
          if (p.id === product.id) {
            return {
              ...p,
              availableQuantity: p.availableQuantity - quantity,
              reservedQuantity: p.reservedQuantity + quantity
            };
          }
          return p;
        }));

        const newReservation = {
          id: reservationId,
          orderId: orderId,
          productId: product.id,
          productName: product.name,
          productPrice: product.price,
          productImage: product.imageUrl,
          userId: userId,
          userName: usersList.find(u => u.id === userId)?.name || 'Shopper',
          quantity: quantity,
          status: 'HELD',
          heldAt: heldAt.toISOString(),
          expiresAt: expiresAt.toISOString(),
          releaseReason: null
        };

        setReservations(prev => [newReservation, ...prev]);

        emitKafkaEvent('inventory.reserved', {
          reservationId,
          orderId,
          productId: product.id,
          userId,
          quantity,
          status: 'HELD',
          expiresAt: expiresAt.toISOString()
        }, 'inventory-service', 'order-service');

        setActiveCheckoutReservation(newReservation);
        setCheckoutStep(1);
        setCurrentTab('checkout');
        if (activeModalProduct) setActiveModalProduct(null);

        showToast(`Stock reserved! Reservation ID: ${reservationId}. Complete payment within 5 minutes.`, 'success');

        return { success: true, reservation: newReservation };
      };

      // PAYMENT PROCESSOR
      const handleProcessPayment = () => {
        if (!activeCheckoutReservation) return;

        if (circuitBreakerTripped) {
          showToast('Payment Circuit Breaker is OPEN due to simulated upstream gateway failure!', 'error');
          return;
        }

        setPaymentLoading(true);

        setTimeout(() => {
          setPaymentLoading(false);

          if (simulatedTimeout) {
            showToast('Gateway Timeout! Order marked PAYMENT_PENDING. Stock remains safely locked until webhook arrives.', 'warning');
            return;
          }

          if (simulatedFailure) {
            // SAGA COMPENSATION: Rollback stock
            setProducts(prev => prev.map(p => {
              if (p.id === activeCheckoutReservation.productId) {
                return {
                  ...p,
                  availableQuantity: p.availableQuantity + activeCheckoutReservation.quantity,
                  reservedQuantity: Math.max(0, p.reservedQuantity - activeCheckoutReservation.quantity)
                };
              }
              return p;
            }));

            setReservations(prev => prev.map(res => {
              if (res.id === activeCheckoutReservation.id) {
                return {
                  ...res,
                  status: 'RELEASED',
                  releaseReason: 'PAYMENT_FAILED_SIMULATION',
                  releasedAt: new Date().toISOString()
                };
              }
              return res;
            }));

            emitKafkaEvent('payment.failed', {
              orderId: activeCheckoutReservation.orderId,
              reservationId: activeCheckoutReservation.id,
              reason: 'CARD_DECLINED_INSUFFICIENT_FUNDS'
            }, 'payment-service', 'inventory-service');

            emitKafkaEvent('inventory.released', {
              reservationId: activeCheckoutReservation.id,
              productId: activeCheckoutReservation.productId,
              reason: 'PAYMENT_FAILED'
            }, 'inventory-service', 'notification-service');

            showToast('Payment Declined! Reserved inventory has been safely released back to available stock.', 'error');
            setActiveCheckoutReservation(null);
            setCurrentTab('products');
            return;
          }

          // SUCCESS
          setProducts(prev => prev.map(p => {
            if (p.id === activeCheckoutReservation.productId) {
              return {
                ...p,
                reservedQuantity: Math.max(0, p.reservedQuantity - activeCheckoutReservation.quantity),
                soldQuantity: p.soldQuantity + activeCheckoutReservation.quantity
              };
            }
            return p;
          }));

          setReservations(prev => prev.map(res => {
            if (res.id === activeCheckoutReservation.id) {
              return {
                ...res,
                status: 'CONFIRMED',
                confirmedAt: new Date().toISOString(),
                releaseReason: 'PAYMENT_SUCCESS'
              };
            }
            return res;
          }));

          const subtotal = activeCheckoutReservation.productPrice * activeCheckoutReservation.quantity;
          const discountAmt = subtotal * discountMultiplier;
          const taxAmt = (subtotal - discountAmt) * 0.08;
          const totalAmt = subtotal - discountAmt + taxAmt;

          const newOrder = {
            id: activeCheckoutReservation.orderId,
            userId: activeCheckoutReservation.userId,
            reservationId: activeCheckoutReservation.id,
            status: 'CONFIRMED',
            subtotal: subtotal,
            discount: discountAmt,
            shippingFee: 0.00,
            tax: taxAmt,
            totalAmount: totalAmt,
            paymentMethod: paymentMethod,
            transactionRef: 'TXN-' + paymentMethod + '-' + Math.random().toString(36).substring(2, 10).toUpperCase(),
            items: [{
              productId: activeCheckoutReservation.productId,
              name: activeCheckoutReservation.productName,
              quantity: activeCheckoutReservation.quantity,
              price: activeCheckoutReservation.productPrice,
              image: activeCheckoutReservation.productImage
            }],
            shippingAddress: currentUser.address,
            customerPhone: currentUser.phone,
            createdAt: new Date().toISOString()
          };

          setOrders(prev => [newOrder, ...prev]);
          setCompletedOrder(newOrder);

          emitKafkaEvent('payment.succeeded', {
            orderId: newOrder.id,
            reservationId: activeCheckoutReservation.id,
            transactionRef: newOrder.transactionRef,
            amount: totalAmt,
            paymentMethod: paymentMethod
          }, 'payment-service', 'order-service');

          emitKafkaEvent('order.confirmed', {
            orderId: newOrder.id,
            userId: newOrder.userId,
            totalAmount: totalAmt,
            status: 'CONFIRMED'
          }, 'order-service', 'notification-service');

          setCart(prev => prev.filter(item => item.id !== activeCheckoutReservation.productId));
          setCheckoutStep(3); // Success Screen
          showToast(`Order Confirmed! Receipt generated for ${newOrder.id}`, 'success');
        }, 1000);
      };

      // CART OPERATIONS
      const addToCart = (product) => {
        setCart(prev => {
          const existing = prev.find(item => item.id === product.id);
          if (existing) {
            if (existing.quantity >= product.availableQuantity) {
              showToast(`Only ${product.availableQuantity} available in total.`, 'warning');
              return prev;
            }
            showToast(`Added another ${product.name} to cart.`, 'info');
            return prev.map(item => item.id === product.id ? { ...item, quantity: item.quantity + 1 } : item);
          } else {
            showToast(`Added ${product.name} to cart.`, 'success');
            return [...prev, { ...product, quantity: 1 }];
          }
        });
        setCartDrawerOpen(true);
      };

      const removeFromCart = (productId) => {
        setCart(prev => prev.filter(item => item.id !== productId));
      };

      const updateCartQuantity = (productId, delta) => {
        setCart(prev => prev.map(item => {
          if (item.id === productId) {
            const product = products.find(p => p.id === productId);
            const newQty = item.quantity + delta;
            if (newQty <= 0) return null;
            if (product && newQty > product.availableQuantity) {
              showToast(`Only ${product.availableQuantity} available in stock.`, 'warning');
              return item;
            }
            return { ...item, quantity: newQty };
          }
          return item;
        }).filter(Boolean));
      };

      const cartSubtotal = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
      const cartDiscount = cartSubtotal * discountMultiplier;
      const cartTax = (cartSubtotal - cartDiscount) * 0.08;
      const cartTotal = cartSubtotal - cartDiscount + cartTax;

      // WISHLIST TOGGLE
      const toggleWishlist = (productId) => {
        setWishlist(prev => {
          if (prev.includes(productId)) {
            showToast('Removed from wishlist.', 'info');
            return prev.filter(id => id !== productId);
          } else {
            showToast('Added to wishlist!', 'success');
            return [...prev, productId];
          }
        });
      };

      // OUTBOX RECOVERY
      const handleRecoverOutbox = () => {
        let count = pendingOutboxEvents.length;
        if (count === 0) {
          showToast('No pending outbox events to recover.', 'info');
          return;
        }
        pendingOutboxEvents.forEach(evt => {
          emitKafkaEvent(evt.topic, evt.payload, 'outbox-relay-worker', 'order-service');
        });
        setPendingOutboxEvents([]);
        showToast(`Successfully published ${count} pending events from Transactional Outbox to Kafka!`, 'success');
      };

      // Filtered products
      const filteredProducts = useMemo(() => {
        return products.filter(p => {

          const matchesSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                p.brand.toLowerCase().includes(searchQuery.toLowerCase());
          const matchesPrice = p.price <= priceFilter;
          return matchesCategory && matchesSearch && matchesPrice;
        }).sort((a, b) => {
          if (sortBy === 'price-low') return a.price - b.price;
          if (sortBy === 'price-high') return b.price - a.price;
          if (sortBy === 'rating') return b.rating - a.rating;
          return 0;

      useEffect(() => {

              toast.type === 'success' ? 'bg-emerald-950/90 text-emerald-100 border-emerald-500' :
              toast.type === 'error' ? 'bg-rose-950/90 text-rose-100 border-rose-500' :
              toast.type === 'warning' ? 'bg-amber-950/90 text-amber-100 border-amber-500' :
              'bg-slate-900/90 text-slate-100 border-slate-700'
            }`}>
              <div className="pt-0.5">
                {toast.type === 'success' && <i data-lucide="check-circle" className="w-5 h-5 text-emerald-400"></i>}
                {toast.type === 'error' && <i data-lucide="alert-triangle" className="w-5 h-5 text-rose-400"></i>}
                {toast.type === 'warning' && <i data-lucide="alert-circle" className="w-5 h-5 text-amber-400"></i>}
                {toast.type === 'info' && <i data-lucide="info" className="w-5 h-5 text-blue-400"></i>}
              </div>
              <div className="flex-1 text-xs font-semibold leading-relaxed">{toast.message}</div>
              <button onClick={() => setToast(null)} className="text-slate-400 hover:text-white">
                <i data-lucide="x" className="w-4 h-4"></i>
              </button>
            </div>
          )}

          {/* ACTIVE RESERVATION STICKY TOP BANNER */}

              <div className="flex items-center space-x-3">

              />

            {currentTab === 'flash-sale' && (
              <FlashSaleSimulatorPage
                products={products}
                onExecuteStressTest={async (productId, stock, buyersCount) => {
                  const prod = products.find(p => p.id === productId);
                  if (prod) {
                    prod.totalQuantity = stock;
                    prod.availableQuantity = stock;
                    prod.reservedQuantity = 0;
                    prod.soldQuantity = 0;
                  }

                  const startTime = performance.now();
                  const results = [];
                  for (let i = 0; i < buyersCount; i++) {
                    const buyerId = `BUYER-${String(i + 1).padStart(3, '0')}`;
                    if (prod.availableQuantity >= 1) {
                      prod.availableQuantity -= 1;
                      prod.reservedQuantity += 1;
                      results.push({
                        buyerId,
                        status: 'SUCCESS',
                        code: 201,
                        reservationId: 'RES-FLASH-' + Math.random().toString(36).substring(2, 6).toUpperCase(),
                        timestamp: new Date().toLocaleTimeString()
                      });
                    } else {
                      results.push({
                        buyerId,
                        status: 'CONFLICT',
                        code: 409,
                        message: 'This item is currently reserved by another customer. It may become available again if their payment is not completed.',
                        timestamp: new Date().toLocaleTimeString()
                      });
                    }
                  }
                  const elapsedMs = Math.round(performance.now() - startTime);
                  const successCount = results.filter(r => r.status === 'SUCCESS').length;
                  const rejectedCount = results.filter(r => r.status === 'CONFLICT').length;
                  const oversellingPrevented = (successCount === stock) && (prod.availableQuantity === 0);

                  emitKafkaEvent('flash.sale.tested', { buyersCount, stock, successCount, rejectedCount }, 'concurrency-engine', 'admin-service');
                  setProducts([...products]);

                  return {
                    successCount,
                    rejectedCount,
                    elapsedMs,
                    oversellingPrevented,
                    results
                  };
                }}
              />

                reservations={reservations}

                        totalQuantity: newTotal,

                }}
                onForceReleaseReservation={(resId) => {
                  const target = reservations.find(r => r.id === resId);
                  if (target && target.status === 'HELD') {
                    setProducts(prev => prev.map(p => {
                      if (p.id === target.productId) {
                        return {
                          ...p,
                          availableQuantity: p.availableQuantity + target.quantity,
                          reservedQuantity: Math.max(0, p.reservedQuantity - target.quantity)
                        };
                      }
                      return p;
                    }));
                    setReservations(prev => prev.map(r => r.id === resId ? { ...r, status: 'RELEASED', releaseReason: 'ADMIN_FORCE_RELEASE' } : r));
                    showToast(`Admin force-released reservation ${resId}`, 'info');
                  }
                }}
              />
            )}

            {currentTab === 'customer' && (
              <CustomerDashboardPage
                currentUser={currentUser}
                orders={orders.filter(o => o.userId === currentUser.id)}
                reservations={reservations.filter(r => r.userId === currentUser.id)}
                wishlistProducts={products.filter(p => wishlist.includes(p.id))}
                onCancelOrder={(orderId) => {
                  setOrders(prev => prev.map(o => o.id === orderId ? { ...o, status: 'CANCELLED' } : o));
                  showToast(`Order ${orderId} cancelled.`, 'info');
                }}
                onRemoveWishlist={toggleWishlist}
                onBuyNow={(p) => handleReserveProduct(p, 1)}
              />
            )}
          </main>

          {/* PRODUCT DETAILS MODAL */}
          {activeModalProduct && (
            <ProductDetailsModal
              product={activeModalProduct}
              onClose={() => setActiveModalProduct(null)}
              onBuyNow={(prod, qty) => handleReserveProduct(prod, qty)}

          {/* AUTH MODAL */}

    function ReservationCountdown({ expiresAt }) {
      const [timeLeft, setTimeLeft] = useState(300);

      useEffect(() => {
        const update = () => {
          const rem = Math.max(0, Math.floor((new Date(expiresAt).getTime() - Date.now()) / 1000));
          setTimeLeft(rem);
        };
        update();
        const id = setInterval(update, 1000);
        return () => clearInterval(id);
      }, [expiresAt]);

      const mins = Math.floor(timeLeft / 60);
      const secs = timeLeft % 60;

      return (
        <div className="flex items-center space-x-1 font-mono font-bold text-amber-300">
          <i data-lucide="timer" className="w-4 h-4"></i>
          <span>{String(mins).padStart(2, '0')}:{String(secs).padStart(2, '0')}</span>
        </div>
      );
    }

    function RealTimeAnalyticsPage({ orders, products, reservations }) {
      const totalRevenue = orders.reduce((sum, o) => sum + (o.status === 'CONFIRMED' || o.status === 'DELIVERED' ? o.totalAmount : 0), 0);

          {/* WISHLIST */}
          {wishlistProducts.length > 0 && (
            <div className="bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-200 dark:border-slate-800 mb-8">
              <h3 className="font-bold text-sm mb-4">Your Wishlist</h3>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                {wishlistProducts.map(p => (
                  <div key={p.id} className="p-3 rounded-2xl border border-slate-100 dark:border-slate-800 flex items-center justify-between text-xs">
                    <span className="font-semibold">{p.name}</span>
                    <button onClick={() => onBuyNow(p)} className="bg-purple-600 text-white font-bold px-3 py-1 rounded-lg">Buy</button>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* ORDERS WITH STATUS TIMELINE */}
          <div className="bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-200 dark:border-slate-800">
            <h3 className="font-bold text-sm mb-4">Order History &amp; Tracking Timeline</h3>
            <div className="space-y-4">
              {orders.map(order => (
                <div key={order.id} className="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 text-xs">
                  <div className="flex justify-between items-center mb-2">
                    <span className="font-bold">{order.id}</span>
                    <span className="bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded">{order.status}</span>
                  </div>
                  <div className="text-[11px] text-slate-500">Paid: ${order.totalAmount.toFixed(2)} via {order.paymentMethod}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // MODAL: PRODUCT DETAILS
    // =========================================================================
    function ProductDetailsModal({ product, onClose, onBuyNow, onAddToCart, isWishlisted, onToggleWishlist }) {
      const [quantity, setQuantity] = useState(1);
      const isOutOfStock = product.availableQuantity <= 0;

      return (
        <div className="fixed inset-0 z-50 overflow-y-auto bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white dark:bg-slate-900 rounded-3xl max-w-3xl w-full overflow-hidden shadow-2xl border border-slate-200 dark:border-slate-800 relative">
            <button onClick={onClose} className="absolute top-5 right-5 p-2 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
              <i data-lucide="x" className="w-5 h-5"></i>
            </button>

            <div className="grid grid-cols-1 md:grid-cols-2">
              <img src={product.imageUrl} alt={product.name} className="h-full w-full object-cover" />
              <div className="p-6 flex flex-col justify-between text-xs">
                <div>
                  <h2 className="text-xl font-black mb-2">{product.name}</h2>
                  <p className="text-slate-500 dark:text-slate-400 mb-4">{product.description}</p>
                  <div className="text-2xl font-black text-purple-600 mb-4">${product.price.toFixed(2)}</div>
                  <div className="text-[11px] text-slate-600 dark:text-slate-300 space-y-1 mb-4">
                    <div>Available Stock: <strong>{product.availableQuantity}</strong></div>
                    <div>Held in Checkout: <strong>{product.reservedQuantity}</strong></div>
                  </div>
                </div>
                <div className="flex gap-2">
                  <button onClick={() => onAddToCart(product)} className="flex-1 bg-slate-100 dark:bg-slate-800 py-3 rounded-xl font-bold">Add to Cart</button>
                  <button onClick={() => onBuyNow(product, quantity)} disabled={isOutOfStock} className="flex-1 bg-purple-600 text-white py-3 rounded-xl font-bold">Instant Reserve</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // CART DRAWER
    // =========================================================================
    function CartDrawer({ open, onClose, cart, onUpdateQty, onRemove, subtotal, discount, tax, total, couponCode, setCouponCode, onApplyCoupon, onCheckout }) {
      if (!open) return null;

      return (
        <div className="fixed inset-0 z-50 overflow-hidden bg-slate-950/60 backdrop-blur-sm flex justify-end">
          <div className="w-full max-w-md bg-white dark:bg-slate-900 h-full shadow-2xl flex flex-col border-l border-slate-200 dark:border-slate-800">
            <div className="p-6 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
              <h3 className="font-black text-base">Your Cart ({cart.length})</h3>
              <button onClick={onClose}><i data-lucide="x" className="w-5 h-5"></i></button>
            </div>
            <div className="flex-1 overflow-y-auto p-6 space-y-3">
              {cart.map(item => (
                <div key={item.id} className="p-3 bg-slate-50 dark:bg-slate-800 rounded-xl flex justify-between items-center text-xs">
                  <div>
                    <h4 className="font-bold">{item.name}</h4>
                    <span className="text-purple-600 font-black">${item.price.toFixed(2)} &times; {item.quantity}</span>
                  </div>
                  <button onClick={() => onRemove(item.id)} className="text-rose-500 font-bold">Remove</button>
                </div>
              ))}
            </div>
            <div className="p-6 border-t border-slate-200 dark:border-slate-800 space-y-3 text-xs">
              <div className="flex justify-between font-bold"><span>Total:</span><span className="text-purple-600 text-sm">${total.toFixed(2)}</span></div>
              <button onClick={onCheckout} className="w-full bg-purple-600 text-white font-bold py-3 rounded-xl">Proceed to Reserve &amp; Checkout</button>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // AUTH MODAL
    // =========================================================================
    function AuthModal({ onClose, mode, setMode, currentUser, setCurrentUser, usersList, onRegister }) {
      return (
        <div className="fixed inset-0 z-50 overflow-y-auto bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white dark:bg-slate-900 rounded-3xl max-w-sm w-full p-6 border border-slate-200 dark:border-slate-800 relative text-xs">
            <button onClick={onClose} className="absolute top-4 right-4"><i data-lucide="x" className="w-4 h-4"></i></button>
            <h3 className="text-base font-black mb-4">Select User Identity</h3>
            <div className="space-y-2">
              {usersList.map(u => (
                <div
                  key={u.id}
                  onClick={() => { setCurrentUser(u); onClose(); }}
                  className="p-3 rounded-xl border border-slate-100 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer flex justify-between"
                >
                  <span className="font-semibold">{u.name}</span>
                  <span className="text-[10px] uppercase font-bold">{u.role}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // FOOTER
    // =========================================================================
    function Footer({ onNavigate }) {
      return (
        <footer className="bg-navy-950 text-slate-400 text-[11px] py-10 border-t border-slate-800">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center space-y-2">
            <div className="text-white font-black text-sm">SmartCart &bull; Cloud Computing Capstone Platform</div>
            <p>Designed for Five-Member Student Group &amp; Live Examination Committee Defense</p>
            <div className="text-slate-600">&copy; 2026 SmartCart. Microservices Architecture &amp; Concurrency Control.</div>
          </div>
        </footer>
      );
    }

    // MOUNT APPLICATION
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
