version: '3.8'

services:
  # ============================================================================
  # INFRASTRUCTURE SERVICES
  # ============================================================================

  # PostgreSQL Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: smartcart-postgres
    environment:
      POSTGRES_DB: smartcart_db
      POSTGRES_USER: smartcart_user
      POSTGRES_PASSWORD: smartcart_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ../database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcart_user -d smartcart_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smartcart-net

  # Redis Distributed Cache & Distributed Locks
  redis:
    image: redis:7.2-alpine
    container_name: smartcart-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - smartcart-net

  # Apache Kafka (KRaft mode - modern zero-zookeeper)
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: smartcart-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - smartcart-net

  # Kafka UI for real-time topic, partition and offset inspection
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: smartcart-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: smartcart-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - smartcart-net

  # ============================================================================
  # SPRING BOOT MICROSERVICES
  # ============================================================================

  # 1. API Gateway (Spring Cloud Gateway)
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: smartcart-api-gateway
    ports:
      - "8000:8000"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      USER_SERVICE_URL: http://user-service:8081
      PRODUCT_SERVICE_URL: http://product-service:8082
      INVENTORY_SERVICE_URL: http://inventory-service:8083
      ORDER_SERVICE_URL: http://order-service:8084
      PAYMENT_SERVICE_URL: http://payment-service:8085
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
    depends_on:
      - postgres
      - redis
      - kafka
    networks:
      - smartcart-net

  # 2. User Service
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: smartcart-user-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/smartcart_db
      SPRING_DATASOURCE_USERNAME: smartcart_user
      SPRING_DATASOURCE_PASSWORD: smartcart_password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - smartcart-net

  # 3. Product Service
  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: smartcart-product-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/smartcart_db
      SPRING_DATASOURCE_USERNAME: smartcart_user
      SPRING_DATASOURCE_PASSWORD: smartcart_password
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - smartcart-net

  # 4. Inventory & Smart Reservation Service (Core Concurrency Engine)
  inventory-service:
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    container_name: smartcart-inventory-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/smartcart_db
      SPRING_DATASOURCE_USERNAME: smartcart_user
      SPRING_DATASOURCE_PASSWORD: smartcart_password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      RESERVATION_TTL_SECONDS: 300
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - smartcart-net

  # 5. Order Service (Saga Coordinator)
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: smartcart-order-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/smartcart_db
      SPRING_DATASOURCE_USERNAME: smartcart_user
      SPRING_DATASOURCE_PASSWORD: smartcart_password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      INVENTORY_SERVICE_URL: http://inventory-service:8083
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - smartcart-net

  # 6. Payment Service
  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: smartcart-payment-service
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/smartcart_db
      SPRING_DATASOURCE_USERNAME: smartcart_user
      SPRING_DATASOURCE_PASSWORD: smartcart_password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - smartcart-net

  # 7. Notification Service
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: smartcart-notification-service
    ports:
      - "8086:8086"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/smartcart_db
      SPRING_DATASOURCE_USERNAME: smartcart_user
      SPRING_DATASOURCE_PASSWORD: smartcart_password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_started
    networks:
      - smartcart-net

networks:
  smartcart-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:

