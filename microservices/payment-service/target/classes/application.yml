server:
  port: 8085

spring:
  application:
    name: payment-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smartcart_db}
    username: ${SPRING_DATASOURCE_USERNAME:smartcart_user}
    password: ${SPRING_DATASOURCE_PASSWORD:smartcart_password}
  jpa:
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

